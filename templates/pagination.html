{% if page.paginator.num_pages > 1 %}
<nav class="pagination-row no-print"><span>Página 
    {{ page.number }} de {{ page.paginator.num_pages }} · {{ page.paginator.count }} registros</span>
    <div>{% if page.has_previous %}<a class="btn btn-sm btn-outline-secondary" href="?page={{ page.previous_page_number }}&filtro={{ filtro|urlencode }}&q={{ buscar|urlencode }}&parroquia={{ request.GET.parroquia|urlencode }}&zona={{ request.GET.zona|urlencode }}&sector={{ request.GET.sector|urlencode }}&estado={{ request.GET.estado|urlencode }}&entidad={{ request.GET.entidad|urlencode }}">Anterior</a>{% endif %}{% if page.has_next %}<a class="btn btn-sm btn-outline-secondary" href="?page={{ page.next_page_number }}&filtro={{ filtro|urlencode }}&q={{ buscar|urlencode }}&parroquia={{ request.GET.parroquia|urlencode }}&zona={{ request.GET.zona|urlencode }}&sector={{ request.GET.sector|urlencode }}&estado={{ request.GET.estado|urlencode }}&entidad={{ request.GET.entidad|urlencode }}">Siguiente</a>{% endif %}</div></nav>{% endif %}
